<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Material Surface Interaction Lab v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif}
body{display:flex;width:100vw;height:100vh;background:#111;color:#fff;overflow:hidden}
#canvas-container{flex:1;position:relative;background:#111;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#control-panel{width:50vw;max-width:680px;min-width:420px;background:#202020;border-left:1px solid #333;padding:22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;transition:.3s}
#control-panel.collapsed{width:0;min-width:0;padding:0;border-left:none;overflow:hidden}
#floating-toggle{position:absolute;top:14px;right:16px;z-index:50;background:#007bff;border:none;color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700}
h3{margin-top:34px;font-size:20px}
.tabs{display:flex;gap:8px}
.tab-btn{flex:1;padding:12px;border:none;border-radius:8px;background:#333;color:#aaa;font-weight:700;cursor:pointer}
.tab-btn.active{background:#007bff;color:#fff}
.info-text{font-size:13px;line-height:1.5;color:#bbb;background:#2a2a2a;padding:12px;border-radius:8px}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.control-group{background:#2b2b2b;padding:12px;border-radius:9px;display:flex;flex-direction:column;gap:8px}
.control-group label{display:flex;justify-content:space-between;font-size:13px;color:#ccc}
.control-group span{color:#4da3ff;font-weight:700}
input[type=range]{width:100%}
input[type=color]{width:100%;height:38px;border:none;background:transparent;cursor:pointer}
.utility-btn{padding:11px 14px;border:1px solid #444;border-radius:8px;background:#333;color:#fff;font-weight:700;cursor:pointer}
.hidden{display:none!important}
@media(max-width:768px){
body{flex-direction:column}
#control-panel{width:100%;max-width:none;min-width:0;height:50vh;border-left:none;border-top:1px solid #333}
#control-panel.collapsed{height:0;width:100%}
.control-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div id="canvas-container">
<button id="floating-toggle">설정창 접기 ◀</button>
<canvas id="simCanvas"></canvas>
</div>

<div id="control-panel">
<h3>Material Surface Interaction Lab</h3>

<div class="tabs">
<button class="tab-btn active" data-mode="1">천</button>
<button class="tab-btn" data-mode="2">고무</button>
<button class="tab-btn" data-mode="3">복사용지</button>
</div>

<p class="info-text" id="mode-desc">천: 원형 자국 없이 가로·세로 직조 격자 자체가 눌리고 휘어집니다.</p>

<button class="utility-btn" id="resetBtn">🔄 리셋</button>

<div class="control-grid">
<div class="control-group"><label>소재 색상</label><input type="color" id="materialColor" value="#c9bba7"></div>
<div class="control-group"><label>배경 색상</label><input type="color" id="bgColor" value="#141414"></div>
</div>

<div id="controls-mode1" class="mode-controls control-grid">
<div class="control-group"><label>눌림 깊이 <span id="v-fabric-depth">46</span></label><input id="fabric-depth" type="range" min="5" max="100" value="46"></div>
<div class="control-group"><label>눌림 범위 <span id="v-fabric-radius">155</span></label><input id="fabric-radius" type="range" min="70" max="280" value="155"></div>
<div class="control-group"><label>직조 격자 밀도 <span id="v-fabric-density">30</span></label><input id="fabric-density" type="range" min="12" max="50" value="30"></div>
<div class="control-group"><label>천 당김 강도 <span id="v-fabric-pull">62</span></label><input id="fabric-pull" type="range" min="0" max="100" value="62"></div>
<div class="control-group"><label>주름 미세감 <span id="v-fabric-wrinkle">28</span></label><input id="fabric-wrinkle" type="range" min="0" max="100" value="28"></div>
<div class="control-group"><label>명암 강도 <span id="v-fabric-shade">32</span></label><input id="fabric-shade" type="range" min="0" max="80" value="32"></div>
<div class="control-group"><label>복원 속도 <span id="v-fabric-recover">38</span></label><input id="fabric-recover" type="range" min="1" max="100" value="38"></div>
<div class="control-group"><label>잔상 유지율 <span id="v-fabric-residue">0</span></label><input id="fabric-residue" type="range" min="0" max="40" value="0"></div>
</div>

<div id="controls-mode2" class="mode-controls control-grid hidden">
<div class="control-group"><label>눌림 깊이 <span id="v-rubber-depth">64</span></label><input id="rubber-depth" type="range" min="5" max="120" value="64"></div>
<div class="control-group"><label>말랑한 범위 <span id="v-rubber-radius">175</span></label><input id="rubber-radius" type="range" min="70" max="300" value="175"></div>
<div class="control-group"><label>탄성 반발 <span id="v-rubber-elastic">78</span></label><input id="rubber-elastic" type="range" min="5" max="120" value="78"></div>
<div class="control-group"><label>가장자리 부풀림 <span id="v-rubber-bulge">46</span></label><input id="rubber-bulge" type="range" min="0" max="100" value="46"></div>
<div class="control-group"><label>표면 광택 <span id="v-rubber-gloss">38</span></label><input id="rubber-gloss" type="range" min="0" max="100" value="38"></div>
<div class="control-group"><label>복원 속도 <span id="v-rubber-recover">72</span></label><input id="rubber-recover" type="range" min="1" max="100" value="72"></div>
</div>

<div id="controls-mode3" class="mode-controls control-grid hidden">
<div class="control-group"><label>압흔 깊이 <span id="v-paper-depth">42</span></label><input id="paper-depth" type="range" min="5" max="100" value="42"></div>
<div class="control-group"><label>구김 복잡도 <span id="v-paper-crumple">46</span></label><input id="paper-crumple" type="range" min="5" max="100" value="46"></div>
<div class="control-group"><label>접힘 선명도 <span id="v-paper-sharp">68</span></label><input id="paper-sharp" type="range" min="5" max="100" value="68"></div>
<div class="control-group"><label>복원 속도 <span id="v-paper-recover">16</span></label><input id="paper-recover" type="range" min="0" max="100" value="16"></div>
<div class="control-group"><label>잔상 유지율 <span id="v-paper-residue">38</span></label><input id="paper-residue" type="range" min="0" max="90" value="38"></div>
</div>
</div>

<script>
const canvas=document.getElementById("simCanvas");
const ctx=canvas.getContext("2d");
const panel=document.getElementById("control-panel");
const toggleBtn=document.getElementById("floating-toggle");

let currentMode=1;
let impacts=[];
let pointerDown=false;
let lastPointer=null;
let time=0;

function el(id){return document.getElementById(id)}
function val(id){return Number(el(id).value)}

function resizeCanvas(){
 const rect=canvas.getBoundingClientRect();
 const dpr=window.devicePixelRatio||1;
 canvas.width=rect.width*dpr;
 canvas.height=rect.height*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resizeCanvas);
setTimeout(resizeCanvas,50);

function hexToRgb(hex){
 let c=hex.replace("#","");
 if(c.length===3)c=c.split("").map(x=>x+x).join("");
 const n=parseInt(c,16);
 return[(n>>16)&255,(n>>8)&255,n&255];
}
function rgba(rgb,a=1){return`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`}
function shade(rgb,v){return rgb.map(x=>Math.max(0,Math.min(255,x+v)))}

function resetSimulation(){impacts=[]}
el("resetBtn").addEventListener("click",resetSimulation);

toggleBtn.addEventListener("click",()=>{
 panel.classList.toggle("collapsed");
 toggleBtn.textContent=panel.classList.contains("collapsed")?"설정창 열기 ▶":"설정창 접기 ◀";
 setTimeout(resizeCanvas,350);
});

document.querySelectorAll(".tab-btn").forEach(btn=>{
 btn.addEventListener("click",()=>switchMode(Number(btn.dataset.mode)));
});

function switchMode(mode){
 currentMode=mode;
 document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.classList.toggle("active",Number(btn.dataset.mode)===mode);
 });
 el("controls-mode1").classList.toggle("hidden",mode!==1);
 el("controls-mode2").classList.toggle("hidden",mode!==2);
 el("controls-mode3").classList.toggle("hidden",mode!==3);

 if(mode===1){
  el("mode-desc").textContent="천: 원형 자국 없이 가로·세로 직조 격자 자체가 눌리고 휘어집니다.";
  el("materialColor").value="#c9bba7";
  el("bgColor").value="#141414";
 }
 if(mode===2){
  el("mode-desc").textContent="고무: 표면 조명과 곡면이 변하며 눌림과 탄성이 표현됩니다.";
  el("materialColor").value="#171717";
  el("bgColor").value="#eeeeee";
 }
 if(mode===3){
  el("mode-desc").textContent="복사용지: 표면에 압흔, 접힘, 구김이 남는 효과입니다.";
  el("materialColor").value="#ffffff";
  el("bgColor").value="#d6d6d6";
 }
 resetSimulation();
}

document.querySelectorAll("input[type='range']").forEach(input=>{
 const v=el("v-"+input.id);
 if(v){
  v.textContent=input.value;
  input.addEventListener("input",()=>v.textContent=input.value);
 }
});

function pointerPos(e){
 const rect=canvas.getBoundingClientRect();
 return{x:e.clientX-rect.left,y:e.clientY-rect.top};
}

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 pointerDown=true;
 const p=pointerPos(e);
 lastPointer=p;
 addImpact(p,0,0,false);
});

canvas.addEventListener("pointermove",e=>{
 if(!pointerDown&&e.pointerType!=="touch")return;
 e.preventDefault();
 const p=pointerPos(e);
 const prev=lastPointer||p;
 addImpact(p,p.x-prev.x,p.y-prev.y,true);
 lastPointer=p;
});

canvas.addEventListener("pointerup",()=>{pointerDown=false;lastPointer=null});
canvas.addEventListener("pointercancel",()=>{pointerDown=false;lastPointer=null});

function addImpact(p,dx,dy,dragging){
 let radius=150,depth=50,recover=.02,residue=0;

 if(currentMode===1){
  radius=val("fabric-radius");
  depth=val("fabric-depth");
  recover=val("fabric-recover")*.0012+.004;
  residue=val("fabric-residue")/100;
 }
 if(currentMode===2){
  radius=val("rubber-radius");
  depth=val("rubber-depth");
  recover=val("rubber-recover")*.0012+.003;
  residue=0;
 }
 if(currentMode===3){
  radius=90+val("paper-crumple")*.8;
  depth=val("paper-depth");
  recover=val("paper-recover")*.0006;
  residue=val("paper-residue")/100;
 }

 impacts.push({
  mode:currentMode,
  x:p.x,y:p.y,dx,dy,
  radius,depth,recover,residue,
  strength:1,
  age:0,
  seed:Math.random()*999,
  angle:Math.atan2(dy,dx)||Math.random()*Math.PI*2,
  dragging
 });

 if(impacts.length>70)impacts.shift();
}

function updateImpacts(){
 for(let i=impacts.length-1;i>=0;i--){
  const im=impacts[i];
  im.age++;
  im.strength-=im.recover;
  if(im.strength<=im.residue){
   if(im.residue<=0)impacts.splice(i,1);
   else im.strength=im.residue;
  }
 }
}

function fabricDisplace(x,y){
 let px=0,py=0,z=0;
 const pullPower=val("fabric-pull")/100;
 const wrinklePower=val("fabric-wrinkle")/100;

 for(const im of impacts){
  if(im.mode!==1)continue;
  const dx=x-im.x,dy=y-im.y;
  const d=Math.hypot(dx,dy);
  const r=im.radius;
  if(d>r)continue;

  const q=1-d/r;
  const fall=q*q*(3-2*q);
  const s=im.strength;
  const dirX=d?dx/d:0;
  const dirY=d?dy/d:0;

  const inward=-im.depth*.24*pullPower*fall*s;
  const dragX=im.dx*.10*fall*s;
  const dragY=im.dy*.10*fall*s;

  px+=dirX*inward+dragX;
  py+=dirY*inward+dragY;

  const basin=-im.depth*.48*fall*s;
  const micro=Math.sin(d*.17-im.age*.09+im.seed)*im.depth*.025*wrinklePower*fall*s;
  z+=basin+micro;
 }
 return{x:x+px,y:y+py,z};
}

function rubberHeight(x,y){
 let z=0;
 for(const im of impacts){
  if(im.mode!==2)continue;
  const dx=x-im.x,dy=y-im.y;
  const d=Math.hypot(dx,dy);
  const r=im.radius;
  if(d>r)continue;

  const q=1-d/r;
  const fall=q*q*(3-2*q);
  const s=im.strength;
  const center=-im.depth*.78*fall*s;
  const ring=Math.exp(-Math.pow((d-r*.55)/(r*.18),2))*im.depth*(val("rubber-bulge")/100)*.32*s;
  const bounce=Math.sin(im.age*.25+d*.045)*val("rubber-elastic")*.018*s*fall;
  z+=center+ring+bounce;
 }
 return z;
}

function drawFabric(w,h,rgb){
 const base=rgb;
 const top=shade(base,14);
 const bottom=shade(base,-16);

 const bg=ctx.createLinearGradient(0,0,w,h);
 bg.addColorStop(0,rgba(top,1));
 bg.addColorStop(.55,rgba(base,1));
 bg.addColorStop(1,rgba(bottom,1));
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,w,h);

 const spacing=Math.max(8,54-val("fabric-density"));
 const shadePower=val("fabric-shade")/100;

 ctx.save();
 ctx.lineCap="round";

 for(let y=-spacing;y<h+spacing;y+=spacing){
  ctx.beginPath();
  for(let x=-40;x<w+40;x+=8){
   const p=fabricDisplace(x,y);
   p.y+=Math.sin(x*.032+time*.01)*0.35;
   if(x<=-40)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle="rgba(255,255,255,.19)";
  ctx.lineWidth=1.05;
  ctx.stroke();

  ctx.strokeStyle="rgba(92,72,50,.16)";
  ctx.lineWidth=.5;
  ctx.stroke();
 }

 for(let x=-spacing;x<w+spacing;x+=spacing){
  ctx.beginPath();
  for(let y=-40;y<h+40;y+=8){
   const p=fabricDisplace(x,y);
   p.x+=Math.sin(y*.028+time*.007)*0.28;
   if(y<=-40)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle="rgba(40,30,22,.18)";
  ctx.lineWidth=.95;
  ctx.stroke();

  ctx.strokeStyle="rgba(255,255,255,.075)";
  ctx.lineWidth=.38;
  ctx.stroke();
 }

 for(const im of impacts){
  if(im.mode!==1)continue;
  const a=im.strength;
  const r=im.radius;

  const shadow=ctx.createRadialGradient(im.x,im.y,0,im.x,im.y,r);
  shadow.addColorStop(0,`rgba(70,55,42,${.11*shadePower*a})`);
  shadow.addColorStop(.42,`rgba(95,75,58,${.055*shadePower*a})`);
  shadow.addColorStop(.82,`rgba(120,100,80,${.018*shadePower*a})`);
  shadow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=shadow;
  ctx.beginPath();
  ctx.ellipse(im.x,im.y,r*.82,r*.76,im.angle*.08,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}

function drawRubber(w,h,rgb){
 const base=rgb;
 const g=ctx.createLinearGradient(0,0,w,h);
 g.addColorStop(0,rgba(shade(base,34),1));
 g.addColorStop(.42,rgba(base,1));
 g.addColorStop(1,rgba(shade(base,-32),1));
 ctx.fillStyle=g;
 ctx.fillRect(0,0,w,h);

 for(const im of impacts){
  if(im.mode!==2)continue;
  const a=im.strength;
  const r=im.radius;
  const gloss=val("rubber-gloss")/100;

  const dent=ctx.createRadialGradient(im.x-r*.18,im.y-r*.22,0,im.x,im.y,r);
  dent.addColorStop(0,`rgba(255,255,255,${.10*gloss*a})`);
  dent.addColorStop(.25,`rgba(0,0,0,${.25*a})`);
  dent.addColorStop(.54,`rgba(0,0,0,${.14*a})`);
  dent.addColorStop(.76,`rgba(255,255,255,${.07*gloss*a})`);
  dent.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=dent;
  ctx.beginPath();
  ctx.ellipse(im.x,im.y,r*.92,r*.78,im.angle*.08,0,Math.PI*2);
  ctx.fill();
 }

}

function drawPaper(w,h,rgb){
 ctx.fillStyle=rgba(rgb,1);
 ctx.fillRect(0,0,w,h);
 for(let y=0;y<h;y+=9){
  ctx.strokeStyle="rgba(0,0,0,.018)";
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(w,y+Math.sin(y*.05));
  ctx.stroke();
 }
}

function animate(){
 time++;
 updateImpacts();

 const rect=canvas.getBoundingClientRect();
 const w=rect.width,h=rect.height;
 const bg=el("bgColor").value;
 const rgb=hexToRgb(el("materialColor").value);

 ctx.clearRect(0,0,w,h);
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,w,h);

 if(currentMode===1)drawFabric(w,h,rgb);
 if(currentMode===2)drawRubber(w,h,rgb);
 if(currentMode===3)drawPaper(w,h,rgb);

 requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
